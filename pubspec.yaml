name: mindsync
version: 1.0.0+1
description: >
  MindSync – A premium productivity and focus management app based on the Pomodoro Technique.
homepage: https://mindsync.app
environment:
  sdk: ">=3.3.0 <4.0.0"

publish_to: "none"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.0.0
  go_router: ^13.2.0
  hive: ^4.0.0
  hive_flutter: ^2.0.0
  isar: ^4.0.0
  isar_flutter_libs: ^4.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^7.0.0
  sign_in_with_apple: ^6.0.0
  shared_preferences: ^3.2.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.6.0
  lottie: ^3.1.0
  flutter_animate: ^5.0.0
  audioplayers: ^6.6.0
  fl_chart: ^0.66.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1
  equatable: ^2.0.5
  collection: ^1.18.0
  flutter_native_splash: ^2.4.0
  responsive_framework: ^1.1.1
  device_info_plus: ^10.1.0
  url_launcher: ^6.2.6
  # Add more as needed

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
    - assets/sounds/
  fonts:
    - family: GoogleFonts
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
        - asset: assets/fonts/Inter-Medium.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
